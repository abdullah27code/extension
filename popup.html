<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello Extension</title>
    <style>
      /* Basic popup layout and styling */
      body {
        margin: 0;
        padding: 16px;
        font-family: Arial, sans-serif;
        min-width: 220px;
        background-color: #f7f7f7;
      }

      .container {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        color: #222;
      }

      button {
        padding: 10px 12px;
        border: none;
        border-radius: 6px;
        background-color: #1a73e8;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }

      button:hover {
        background-color: #1557b0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Popup heading shown to the user -->
      <h1>My First Extension</h1>

      <!-- Button that will trigger the alert -->
      <button id="helloButton" type="button">Say Hello</button>
    </div>

    <!-- Load popup behavior from popup.js -->
    <script src="popup.js"></script>
  </body>
</html>
